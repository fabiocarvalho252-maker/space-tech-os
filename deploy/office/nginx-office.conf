# Trecho para incluir DENTRO do bloco "server { ... }" do srmpretech.online.
# Não substitui o bloco server inteiro e não altera o Nginx real.
# Os cabeçalhos de segurança (add_header) não são repetidos aqui: um add_header
# dentro de location anula os definidos no bloco server, então ficam no bloco server.

location /office-api/ {
    proxy_pass http://127.0.0.1:4317;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /office-ws {
    proxy_pass http://127.0.0.1:4317;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
