# Gera o instalador Windows (.exe) do SPACE TECH OS desktop em um runner
# Windows do GitHub Actions, sem precisar de máquina Windows local.
#
# Dois modos:
#  - aba Actions -> "Build desktop (Windows)" -> Run workflow: só compila e
#    sobe o .exe como artefato (baixe em Artifacts, exige login no GitHub).
#  - push de uma tag "desktop-v*" (ex.: git tag desktop-v1.0.0 && git push
#    origin desktop-v1.0.0): compila E publica o .exe numa GitHub Release,
#    gerando um link de download direto.
#
# Não interfere no projeto web. Ver DESKTOP-WINDOWS.md.
name: Build desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write # necessário para criar a Release

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      # No Windows o binário do Electron é baixado no postinstall; se o npm
      # tiver bloqueado o script, garante o download.
      - name: Garantir runtime do Electron
        run: node node_modules/electron/install.js

      - name: Gerar instalador Windows (NSIS)
        run: npm run build:win

      - name: Publicar o instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: SPACE-TECH-OS-Setup
          path: desktop/dist/*.exe
          if-no-files-found: error

      # Só quando o gatilho é uma tag desktop-v*: cria a Release com o .exe
      # anexado, que vira um link de download direto.
      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SPACE TECH OS ${{ github.ref_name }}
          files: desktop/dist/*.exe
          body: |
            Instalador do SPACE TECH OS para Windows.

            Baixe o arquivo `SPACE-TECH-OS-Setup-*.exe` abaixo e execute para instalar.
