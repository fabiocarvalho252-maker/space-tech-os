services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: space_db
      POSTGRES_USER: space_user
      POSTGRES_PASSWORD: ChangeMe123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space_user -d space_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://space_user:ChangeMe123!@db:5432/space_db
      PORT: 3000
      AUTH_SECRET: "0f3f8b7c8e1d4a6f9b2c5d7e8f1a3b4c6d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a"
      NEXTAUTH_SECRET: "0f3f8b7c8e1d4a6f9b2c5d7e8f1a3b4c6d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a"
      NEXTAUTH_URL: http://localhost:3000

volumes:
  postgres_data:
